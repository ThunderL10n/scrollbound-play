<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Scrollbound</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		
#lock {
	position: absolute; inset: 0; z-index: 2; display: flex; align-items: center; justify-content: center;
	background: #120f14; font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif; color: #e8dcc4;
}
#lock form { display: flex; flex-direction: column; gap: 0.75rem; width: min(20rem, 85vw); text-align: center; }
#lock h1 { margin: 0 0 0.5rem; font-size: 1.6rem; letter-spacing: 0.05em; color: #e2b85c; }
#lock input[type=password] {
	font-size: 1.1rem; padding: 0.6rem; border-radius: 0.4rem; border: 1px solid #6b5a45; background: #1d1820; color: #f2e8d6;
}
#lock button { font-size: 1.1rem; padding: 0.6rem; border-radius: 0.4rem; border: 0; background: #e2b85c; color: #1d1820; cursor: pointer; }
#lock button:disabled { opacity: 0.6; cursor: default; }
#lock label { font-size: 0.9rem; opacity: 0.85; }
#lock-msg { min-height: 1.3em; font-size: 0.95rem; color: #e8a0a0; }
#lock progress { width: 100%; display: none; }
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<meta name="apple-mobile-web-app-capable" content="yes">
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="lock">
			<form id="lock-form">
				<h1>Scrollbound</h1>
				<input id="lock-pass" type="password" autocomplete="current-password" placeholder="Password" required>
				<label><input id="lock-remember" type="checkbox" checked> Remember on this device</label>
				<button id="lock-go" type="submit">Play</button>
				<progress id="lock-progress"></progress>
				<div id="lock-msg"></div>
			</form>
		</div>

		<div id="status">
			<img id="status-splash" class="show-image--false fullsize--true use-filter--true" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":38413868,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

function startScrollbound() {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}

(function () {
	const LOCK_KEY = 'scrollbound-web-pass';
	const form = document.getElementById('lock-form');
	const pass = document.getElementById('lock-pass');
	const remember = document.getElementById('lock-remember');
	const go = document.getElementById('lock-go');
	const bar = document.getElementById('lock-progress');
	const msg = document.getElementById('lock-msg');
	const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
	let lock = null;

	async function deriveKey(password) {
		const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
		return crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: b64(lock.salt), iterations: lock.iterations },
			base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
	}

	async function download(url, size) {
		const res = await fetch(url, { cache: 'no-cache' });
		if (!res.ok) throw new Error('Download failed (' + res.status + ')');
		const reader = res.body.getReader();
		const out = new Uint8Array(size);
		let at = 0;
		bar.style.display = 'block';
		bar.max = size;
		for (;;) {
			const { done, value } = await reader.read();
			if (done) break;
			out.set(value, at);
			at += value.length;
			bar.value = at;
		}
		return out.subarray(0, at);
	}

	async function unlock(password) {
		go.disabled = true;
		msg.textContent = '';
		try {
			if (lock === null) lock = await (await fetch('lock.json', { cache: 'no-cache' })).json();
			const key = await deriveKey(password);
			try {
				await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(lock.check.iv) }, key, b64(lock.check.data));
			} catch (e) {
				throw new Error('Wrong password.');
			}
			try {
				if (remember.checked) localStorage.setItem(LOCK_KEY, password); else localStorage.removeItem(LOCK_KEY);
			} catch (e) { /* storage blocked: just don't remember */ }
			msg.style.color = '#e8dcc4';
			msg.textContent = 'Loading...';
			const enc = await download('index.pck.enc', lock.encSize);
			msg.textContent = 'Unlocking...';
			const pck = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: enc.subarray(0, 12) }, key, enc.subarray(12));
			const realFetch = window.fetch.bind(window);
			window.fetch = function (input, init) {
				const url = typeof input === 'string' ? input : input.url;
				if (/(^|\/)index\.pck(\?|$)/.test(url)) {
					return Promise.resolve(new Response(pck, { headers: { 'Content-Length': String(pck.byteLength) } }));
				}
				return realFetch(input, init);
			};
			document.getElementById('lock').remove();
			startScrollbound();
		} catch (e) {
			msg.style.color = '#e8a0a0';
			msg.textContent = e && e.message ? e.message : String(e);
			bar.style.display = 'none';
			go.disabled = false;
		}
	}

	form.addEventListener('submit', (ev) => {
		ev.preventDefault();
		unlock(pass.value);
	});
	let saved = null;
	try { saved = localStorage.getItem(LOCK_KEY); } catch (e) { /* no storage */ }
	if (saved) {
		pass.value = saved;
		unlock(saved);
	} else {
		pass.focus();
	}
}());
		</script>
	</body>
</html>
